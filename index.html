<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bikelane Brawlers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#15171d">
<meta name="description" content="Race, jump and brawl your way down the bike lane.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brawlers">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preload" href="fonts/bungee-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Bungee';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/bungee-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/chakra-petch-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/chakra-petch-latin-700-normal.woff2) format('woff2')}
/* Layout: one arcade cabinet screen. WebGL street underneath, 2D HUD canvas on top, legend beneath on desktop; full-screen with swipe controls on phones. */
:root{
  --bg:#15171d; --panel:#21252e; --fg:#f3efe4; --muted:#a3a7b3;
  --accent:#ffcc1a; --lane:#2f8f5b; --danger:#ff4d3d;
  --display:'Bungee', Impact, 'Arial Black', sans-serif;
  --body:'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body);
  margin:0; box-sizing:border-box; overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:max(12px, env(safe-area-inset-top, 0px));
  padding-bottom:max(12px, env(safe-area-inset-bottom, 0px));
  -webkit-touch-callout:none; overscroll-behavior:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
#stage{position:relative; max-width:100%; border-radius:8px; overflow:hidden; background:#000; box-shadow:0 0 0 2px var(--panel), 0 18px 40px rgba(0,0,0,.45); touch-action:none}
#stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
#legend{display:flex; flex-wrap:wrap; gap:6px 18px; justify-content:center; font-size:13px; color:var(--muted); max-width:960px}
#legend b{color:var(--fg); font-weight:700}
kbd{font-family:var(--body); font-weight:700; font-size:12px; color:var(--bg); background:var(--fg); border-radius:4px; padding:1px 6px; letter-spacing:.03em}
body.touch{padding:0; gap:0}
body.touch #stage{border-radius:0; box-shadow:none}
body.touch #hud{left:env(safe-area-inset-left, 0px); width:calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))}
#rot{display:none; font-size:15px; color:var(--muted); text-align:center; padding:16px}
@media (orientation:portrait){ body.touch #rot{display:block} }
body.touch #legend{display:none}
#err[hidden]{display:none}
#err{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; font-size:16px; background:var(--bg)}
#upd{position:fixed; left:50%; transform:translateX(-50%); top:max(10px, env(safe-area-inset-top, 0px)); z-index:10;
  font-family:var(--display); font-size:14px; color:var(--bg); background:var(--accent); border:0; border-radius:999px;
  padding:12px 20px; box-shadow:0 8px 24px rgba(0,0,0,.5); -webkit-tap-highlight-color:transparent}
#upd[hidden]{display:none}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
</style>
</head>
<body>

<div id="stage">
  <canvas id="gl" aria-label="Bikelane Brawlers 3D street"></canvas>
  <canvas id="hud" aria-label="Bikelane Brawlers scoreboard"></canvas>
  <div id="err" hidden>The 3D engine didn't load. Close the app and open it again.</div>
</div>
<div id="legend">
  <span><kbd>←</kbd> <kbd>→</kbd> <b>steer</b></span>
  <span><kbd>Space</kbd> <b>jump</b></span>
  <span><kbd>C</kbd> camera</span>
  <span><kbd>P</kbd> pause · <kbd>M</kbd> mute · <kbd>R</kbd> restart</span>
</div>
<div id="rot">Turn your phone sideways to play full screen.</div>

<button id="upd" hidden>New version ready. Tap to update</button>
<script src="three.min.js"></script>
<script>
(() => {
if(!window.THREE){ document.getElementById('err').hidden = false; return; }
const T = THREE;
const glc = document.getElementById('gl');
const hud = document.getElementById('hud');
const ctx = hud.getContext('2d');
const stage = document.getElementById('stage');
let W = 960; const H = 540;
let K = 1, glW = 960, hudL = 0, hudW = 960;

// ---------- world geometry (game logic in "px": x = distance along the street, y = across it) ----------
const PX_PER_M = 20;
const RACE_M = 1500;
const FINISH = RACE_M * PX_PER_M;
const ROAD_TOP = 58, CENTER = 150, ROAD_EDGE = 262, BIKE_TOP = 282, BIKE_BOT = 412, CURB = 420, WALK_END = 560;
const YMIN = 170, YMAX = 400;
const SCREEN_X = 250;
// px -> metres in 3D. Street runs along -Z, road on the left (-X), sidewalk on the right (+X).
const S = 1/PX_PER_M, ZS = 1/28, LAT0 = 300;
const lat = y => (y - LAT0) * S;
const fwd = x => -x * S;

const CAR_COLORS = ['#d9dde4','#2b2f3a','#b3202a','#2d5fa8','#6f7682','#e7b533','#3d7a4f','#8a4fb0'];

// ---------- helpers ----------
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const hash = i => { let x = Math.sin(i*127.1 + 311.7)*43758.5453; return x - Math.floor(x); };
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2); ctx.fill(); }
function fmtTime(t){ const m=Math.floor(t/60), s=t-m*60; return m+':'+(s<10?'0':'')+s.toFixed(2); }
function ord(n){ return n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th'); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => clamp(Math.round(amt < 0 ? v*(1+amt) : v + (255 - v)*amt), 0, 255);
  return '#' + [f(r),f(g),f(b)].map(v => v.toString(16).padStart(2,'0')).join('');
}

// ---------- audio ----------
// Everything is synthesised with Web Audio, so it works offline. Two buses: sound effects and music.
let AC = null, muted = lsGet('bb3d_muted') === '1', master = null, sfxBus = null, musicBus = null, noiseBuf = null;
function initAudio(){
  if(AC){ if(AC.state === 'suspended' && !document.hidden) AC.resume().catch(()=>{}); return; }
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : 1; master.connect(AC.destination);
  sfxBus = AC.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
  musicBus = AC.createGain(); musicBus.gain.value = .55; musicBus.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
  if(AC.state === 'suspended') AC.resume().catch(()=>{});
  startMusic(); startMotor();
}
function setMuted(m){
  muted = m; lsSet('bb3d_muted', m ? '1' : '0');
  if(master) master.gain.setTargetAtTime(m ? 0 : 1, AC.currentTime, .05);
}
function sfx(f, d=.1, type='square', slide=0, vol=.05){
  if(!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f+slide), t+d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g).connect(sfxBus); o.start(t); o.stop(t+d+.02);
}
// filtered noise burst: crashes, landings, whooshes
function noise(d=.25, vol=.12, freq=900, q=.8, type='lowpass', sweep=0){
  if(!AC) return;
  const t = AC.currentTime, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; src.playbackRate.value = .5 + Math.random();
  f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
  if(sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq + sweep), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  src.connect(f).connect(g).connect(sfxBus); src.start(t, Math.random()*.5); src.stop(t + d + .02);
}
const SND = {
  jump(){ sfx(330, .18, 'triangle', 400, .05); noise(.2, .05, 1800, 1, 'bandpass', 1500); },
  land(){ sfx(90, .08, 'triangle', 0, .06); noise(.09, .06, 500); },
  punch(){ sfx(140, .12, 'sawtooth', -80, .07); noise(.12, .14, 1400, 1.2, 'bandpass', -700); },
  whiff(){ noise(.12, .05, 2200, 2, 'bandpass', -1500); },
  crash(){ noise(.6, .22, 1200, .7, 'lowpass', -1000); sfx(80, .45, 'sawtooth', -45, .08); setTimeout(() => noise(.25, .1, 3500, 3, 'bandpass', -2000), 90); },
  bonk(){ noise(.3, .16, 900, .9, 'lowpass', -600); sfx(110, .25, 'square', -60, .06); },
  boost(){ sfx(520, .25, 'triangle', 700, .05); noise(.5, .08, 600, 1.4, 'bandpass', 3000); },
  star(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => sfx(f, .18, 'triangle', 0, .06), i*80)); },
  honk2(vol=.035){ for(const t of [0, 170]) setTimeout(() => { sfx(392, .11, 'sawtooth', 0, vol); sfx(494, .11, 'sawtooth', 0, vol); }, t); },
  dozerHorn(){ for(const t of [0, 420]) setTimeout(() => { sfx(98, .35, 'sawtooth', 0, .07); sfx(147, .35, 'square', 0, .04); }, t); },
  finish(){ [523, 659, 784].forEach((f, i) => setTimeout(() => sfx(f, .2, 'triangle', 0, .07), i*120)); setTimeout(() => { sfx(1047, .7, 'triangle', 0, .07); sfx(784, .7, 'sine', 0, .05); }, 380); },
};

// scooter motor: a soft electric whine that rises with speed
let motor = null;
function startMotor(){
  const o = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth'; o2.type = 'sine'; f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = 0;
  o.connect(f); o2.connect(f); f.connect(g).connect(sfxBus); o.start(); o2.start();
  motor = { o, o2, g };
}
function motorTick(on, speed){
  if(!motor) return;
  const t = AC.currentTime, k = Math.min(1, speed / 700);
  motor.o.frequency.setTargetAtTime(70 + 160*k, t, .1); motor.o2.frequency.setTargetAtTime(140 + 320*k, t, .1);
  motor.g.gain.setTargetAtTime(on ? .006 + .012*k : 0, t, .15);
}

// soothing background music: slow major-seventh chords, a soft pad, a gentle plucked arpeggio and a quiet bass
const CHORDS = [ // Fmaj7, Em7, Dm7, Cmaj7 (semitones from A4 = 440 Hz)
  [-16, -12, -9, -5], [-17, -14, -10, -7], [-19, -16, -12, -9], [-21, -17, -14, -10]
];
const hz = n => 440 * Math.pow(2, n/12);
let musicTimer = null, nextBeat = 0, beat = 0;
const BEAT = 60/76;
function pad(freq, t, d){
  const g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 1100;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.022, t + d*.35); g.gain.linearRampToValueAtTime(0, t + d);
  for(const det of [-6, 6]){ const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = freq; o.detune.value = det; o.connect(f); o.start(t); o.stop(t + d + .05); }
  f.connect(g).connect(musicBus);
}
function pluck(freq, t, vol=.04){
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = 'sine'; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = 2400;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 1.1);
  o.connect(f).connect(g).connect(musicBus); o.start(t); o.stop(t + 1.2);
}
function scheduleMusic(){
  if(!AC || AC.state !== 'running') return;
  while(nextBeat < AC.currentTime + .4){
    const bar = Math.floor(beat / 8) % CHORDS.length, step = beat % 8, ch = CHORDS[bar], t = nextBeat;
    if(step === 0){
      for(const n of ch) pad(hz(n), t, BEAT*8 + .3);
      pluck(hz(ch[0] - 12), t, .05); // bass
    }
    if(step === 4) pluck(hz(ch[0] - 12), t, .035);
    const arp = [0, 2, 1, 3, 2, 1, 3, 2][step];
    if(step % 2 === 0 || Math.random() < .5) pluck(hz(ch[arp] + 12), t + (step % 2 ? BEAT*.5 : 0), .022);
    nextBeat += BEAT; beat++;
  }
}
function startMusic(){
  nextBeat = AC.currentTime + .2; beat = 0;
  musicTimer = setInterval(scheduleMusic, 100);
}
document.addEventListener('visibilitychange', () => {
  if(!AC) return;
  if(document.hidden) AC.suspend().catch(()=>{});
  else AC.resume().then(() => { nextBeat = Math.max(nextBeat, AC.currentTime + .1); }).catch(()=>{});
});

// =====================================================================
// 3D scene
// =====================================================================
const renderer = new T.WebGLRenderer({ canvas: glc, antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const SKY = '#a9cbe6';
const scene = new T.Scene();
scene.background = new T.Color(SKY);
scene.fog = new T.Fog(SKY, 70, 175);
const camera = new T.PerspectiveCamera(62, 16/9, .1, 420);
scene.add(new T.HemisphereLight('#e6f2ff', '#6b5f4c', 1.9));
const sun = new T.DirectionalLight('#fff1d6', 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-34, right:34, top:34, bottom:-34, near:1, far:120 });
sun.shadow.bias = -.0006;
scene.add(sun, sun.target);

const matCache = {}, geoCache = {};
function mat(color, glow){
  const k = color + (glow ? '!' : '');
  return matCache[k] || (matCache[k] = new T.MeshLambertMaterial({ color, emissive: glow ? color : 0x000000, emissiveIntensity: glow ? .9 : 0 }));
}
const box = (w,h,d) => geoCache['b'+w+'|'+h+'|'+d] || (geoCache['b'+w+'|'+h+'|'+d] = new T.BoxGeometry(w,h,d));
const cyl = (r1,r2,h,s=12) => geoCache['c'+r1+'|'+r2+'|'+h+'|'+s] || (geoCache['c'+r1+'|'+r2+'|'+h+'|'+s] = new T.CylinderGeometry(r1,r2,h,s));
const sph = (r,a=1) => geoCache['s'+r+'|'+a] || (geoCache['s'+r+'|'+a] = new T.SphereGeometry(r, 16, 10, 0, Math.PI*2, 0, Math.PI*a));
function add(parent, geo, m, x=0, y=0, z=0, rx=0, ry=0, rz=0, shadow=true){
  const mesh = new T.Mesh(geo, m);
  mesh.position.set(x,y,z); mesh.rotation.set(rx,ry,rz);
  mesh.castShadow = shadow;
  parent.add(mesh); return mesh;
}
function canvasTex(w, h, draw, repX=1, repY=1){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(repX, repY);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = T.SRGBColorSpace;
  return t;
}

// ---------- the course ----------
// Gameplay runs on a straight line (x along the street, y across it). The 3D view bends that line into a winding street.
const S0 = -160, S1 = FINISH*S + 320, SEG = 260;
const bends = [];
{ let s = 130; while(s < S1 - 120){ const L = rand(110, 170); bends.push({ s0: s, L, A: (Math.random() < .5 ? -1 : 1) * rand(.28, .62) }); s += L + rand(50, 150); } }
const NT = Math.ceil(S1 - S0) + 2, TX = new Float32Array(NT), TZ = new Float32Array(NT), TH = new Float32Array(NT);
{ let x = 0, z = -S0, th = 0;
  for(let i = 0; i < NT; i++){
    const s = S0 + i; let k = 0;
    for(const b of bends) if(s >= b.s0 && s < b.s0 + b.L) k += b.A / b.L * (1 - Math.cos(2*Math.PI*(s - b.s0)/b.L));
    TX[i] = x; TZ[i] = z; TH[i] = th;
    th += k; x += Math.sin(th); z -= Math.cos(th);
  } }
const FR = { x:0, z:0, th:0 };
function fr(s){
  const u = clamp(s - S0, 0, NT - 1.001), i = u|0, f = u - i;
  FR.x = TX[i] + (TX[i+1] - TX[i])*f; FR.z = TZ[i] + (TZ[i+1] - TZ[i])*f; FR.th = TH[i] + (TH[i+1] - TH[i])*f;
  return FR;
}
// metres along / across -> world
function placeM(obj, s, l, h, yaw=0){ const f = fr(s); obj.position.set(f.x + Math.cos(f.th)*l, h, f.z + Math.sin(f.th)*l); obj.rotation.y = -f.th + yaw; }
// game px -> world
function place(obj, xpx, ypx, h, yaw=0){ placeM(obj, xpx*S, lat(ypx), h, yaw); }
function toW(xpx, ypx, h, out){ const f = fr(xpx*S), l = lat(ypx); return out.set(f.x + Math.cos(f.th)*l, h, f.z + Math.sin(f.th)*l); }

// ---------- static street ----------
function ribbon(s0, s1, l0, l1, h0, h1, material, tile, uRep=1, step=2){
  const n = Math.ceil((s1 - s0)/step) + 1, pos = new Float32Array(n*6), uv = new Float32Array(n*4), idx = [];
  for(let i = 0; i < n; i++){
    const s = Math.min(s1, s0 + i*step), f = fr(s), c = Math.cos(f.th), sn = Math.sin(f.th), v = (s - s0)/tile;
    pos.set([f.x + c*l0, h0, f.z + sn*l0, f.x + c*l1, h1, f.z + sn*l1], i*6);
    uv.set([0, v, uRep, v], i*4);
    if(i){ const a = (i-1)*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); }
  }
  const g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3)); g.setAttribute('uv', new T.BufferAttribute(uv, 2)); g.setIndex(idx);
  g.computeVertexNormals();
  const m = new T.Mesh(g, material); m.receiveShadow = true; scene.add(m); return m;
}
function strip(y0, y1, material, h, tile, uRep=1){
  for(let s = S0; s < S1; s += SEG) ribbon(s, Math.min(S1, s + SEG), lat(y0), lat(y1), h, h, material, tile, uRep);
}
function wall(y, h0, h1, material){
  for(let s = S0; s < S1; s += SEG) ribbon(s, Math.min(S1, s + SEG), lat(y), lat(y), h0, h1, material, 10);
}
// road + buffer: canvas is drawn across (x) by along (y). 1px = 1 game px across; 400px = 20 m along.
const roadTex = canvasTex(BIKE_TOP - ROAD_TOP, 400, (g, w, h) => {
  g.fillStyle = '#3d4047'; g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){ g.fillStyle = Math.random()<.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.08)'; g.fillRect(Math.random()*w, Math.random()*h, 2, 2); }
  const cy = CENTER - ROAD_TOP;
  g.fillStyle = '#e7bb2e'; g.fillRect(cy - 5, 0, 3, h); g.fillRect(cy + 2, 0, 3, h);
  const e = ROAD_EDGE - ROAD_TOP;
  g.fillStyle = '#eceae3'; g.fillRect(e, 0, 3, h); g.fillRect(w - 3, 0, 3, h);
  g.strokeStyle = 'rgba(236,234,227,.7)'; g.lineWidth = 3;
  for(let y = -20; y < h + 20; y += 40){ g.beginPath(); g.moveTo(e + 3, y); g.lineTo(w - 3, y + 26); g.stroke(); }
});
strip(ROAD_TOP, BIKE_TOP, new T.MeshLambertMaterial({ map: roadTex }), 0, 20);
const bikeTex = canvasTex(BIKE_BOT - BIKE_TOP, 520, (g, w, h) => {
  g.fillStyle = '#2f8f5b'; g.fillRect(0,0,w,h);
  for(let i=0;i<500;i++){ g.fillStyle = 'rgba(0,0,0,.07)'; g.fillRect(Math.random()*w, Math.random()*h, 3, 2); }
  g.save(); g.translate(w/2, h*.55); g.rotate(-Math.PI/2); g.scale(1.6, 1.6);
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 3;
  g.beginPath(); g.arc(-14, 6, 9, 0, 7); g.stroke(); g.beginPath(); g.arc(14, 6, 9, 0, 7); g.stroke();

function addObs(o){

  else if(o.type==='dozer') o.mesh = makeDozer(o);
  else if(o.type==='moped') o.mesh = makeMoped(o);
  else if(o.type==='mobility') o.mesh = makeMobility(o);
  else if(o.type==='pothole') o.mesh = makePothole();

function spawnRoadCar(){

  const turnSpot = Math.random() < .35 ? spots.find(sp => sp.x - TURN_R > x + 600) : null;
  addObs({ type:'road', turnSpot, x, y, w: Math.random()<.2?130:98, h:48, vx:v, vmax:v, blind: Math.random() < .35, color: pick(CAR_COLORS), honked:false, behind });
}
function spawnTurner(spot){
  const Xs = spot.x - TURN_R, x = player.x + 2300;
  if(x > Xs - 150) return;
  // time it so the car is crossing the bike lane about when you get there
  const tp = (Xs + .8*TURN_R - player.x) / Math.max(player.speed, 300);
  const vx = clamp((Xs - x) / Math.max(.5, tp - 1.8) * rand(.8, 1.2), 50, 260);
  for(const o of obs) if(o.type === 'road' && Math.abs(o.x - x) < 300) o.dead = true;
  addObs({ type:'turn', x, y:210, w:98, h:48, L:98, Wd:48, vx, a:0, phase:0, spot, color: pick(CAR_COLORS) });
}

// a bus pulls out of traffic, across into the bike lane at a stop ahead, picks people up and pulls out again
const BUS_ROAD_Y = 212, BUS_LANE_Y = 384, BUS_IN = 650, BUS_OUT = 520;
function spawnBus(){
  let stopX = 0;
  for(let x = player.x + 2800; x < player.x + 3800; x += 60) if(!nearSpot(x*S, 7) && !nearSpot((x - BUS_IN/2)*S, 4)){ stopX = x; break; }
  if(!stopX || stopX > FINISH - 900) return false;
  for(const o of obs) if((o.type === 'road' || o.type === 'bus') && Math.abs(o.x - (stopX - BUS_IN)) < 500) o.dead = o.type === 'road';
  const st = { x: stopX, y: BUS_LANE_Y, laneY: BUS_LANE_Y, shelterY: 470, n: 2 + (Math.random()*3|0) };
  st.mesh = makeStop(st); scene.add(st.mesh); stops.push(st);
  addObs({ type:'bus', x: stopX - BUS_IN, y: BUS_ROAD_Y, w: 240, h: 50, vx: 260, vy: 0, a: 0, phase: 1, stopX, st, dwell: 0 });
  return true;

function jammed(c){ return HEAVY[c.type] && !c.fly && !c.dead && (c.wrecked || c.skid || (c.type === 'road' && c.vx < 25)); }
function checkPileup(dt){
  dozerT -= dt;
  if(dozerT > 0 || mode !== 'race' || player.x > FINISH - 1500 || obs.some(o => o.type === 'dozer')) return;
  const js = obs.filter(c => jammed(c) && c.x > player.x - 200 && c.x < player.x + 1800);
  for(const c of js){

      addObs({ type:'dozer', x: player.x - 1100, y, w: 150, h: 96, vx: 1050 });

const ROOF_Z = 64; // delivery truck roof (2.3 m) in jump units
const roofOf = o => o.type === 'van' || o.type === 'bus' ? ROOF_Z : 45; // parked car roof is about 1.6 m
function jump(r){
  if(r.vz !== 0 || (r.z > 0 && !r.onVan) || r.jcd > 0 || r.wipe > 0) return;
  r.onVan = null;
  r.vz = 470; r.jcd = .2;
  if(r.isPlayer) SND.jump();

function punch(a){
  if(a.pcd > 0 || a.wipe > 0) return;
  a.pcd = .45; a.pAnim = .2;
  let best = null, bd = 1e9;
  for(const b of racers){
    if(b === a || b.wipe > 0) continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    if(Math.abs(dx) < 62 && Math.abs(dy) < 62 && Math.abs(b.z - a.z) < 36){
      const d = Math.abs(dx) + Math.abs(dy);
      if(d < bd){ bd = d; best = b; }
    }
  }
  if(best){
    const dir = Math.sign(best.y - a.y) || (best.y < 300 ? -1 : 1);
    a.pDir = dir;
    best.hp -= 20; best.hits++;
    best.kvy = dir * 430; best.speed *= .72;
    burst(best.x, best.y, 1.5 + best.z*ZS, '#fff3b0', 12);
    text(best.x, best.y, pick(['POW!','WHAM!','BIFF!','SMACK!']), a.isPlayer ? '#ffcc1a' : '#ff6b5e', 2.4 + best.z*ZS);
    if(a.isPlayer || best.isPlayer) SND.punch();
    if(best.isPlayer) shake = .35;
    if(best.hp <= 0){ wipeout(best); a.kos++; text(best.x, best.y, 'K.O.!', '#ff4d3d', 3.2); }
  } else {
    a.pDir = -a.pDir;
    if(a.isPlayer) SND.whiff();
  }
}

function wipeout(r){
  r.wipe = 1.6; r.hp = 0; r.onVan = null; if(r.vz > 0) r.vz = 0;
  burst(r.x, r.y, .6, '#cfd3dc', 18);
  if(r.isPlayer){ SND.crash(); shake = .6; }
}

// ---------- crash physics: anything light in the lane gets sent flying ----------
const HEAVY = { road:1, turn:1, pull:1, car:1, van:1 };
const LIGHT = { moped:1, mobility:1 };
function launch(o, vx, vy, vz){
  o.fly = true; o.wrecked = false; o.skid = false; o.vx = vx; o.fvy = vy; o.vz = vz; o.hz = o.hz || 0; o.bounces = 0;
  o.rot = o.rot || { x:0, y:0, z:0 }; o.spin = { x: rand(-9, 9), y: rand(-7, 7), z: rand(-9, 9) };
  if(Math.abs(o.x - player.x) < 1400){
    sfx(200, .28, 'sawtooth', -140, .05); noise(.4, .1, 2500, 1, 'bandpass', -2000);
    if(Math.random() < .6) text(o.x, o.y, pick(['YEET!','WHOOPS!','AIRMAIL!','SPLAT!']), '#ffd27a', 3);
    burst(o.x, o.y, 1, '#ffd27a', 8);
  }
}
function flyStep(o, dt){
  o.x += o.vx*dt; o.y += o.fvy*dt; o.vz -= 1400*dt; o.hz += o.vz*dt;
  o.rot.x += o.spin.x*dt; o.rot.y += o.spin.y*dt; o.rot.z += o.spin.z*dt;
  if(o.hz <= 0){
    o.hz = 0;
    if(o.vz < -260 && o.bounces < 3){ o.vz = -o.vz*.45; o.vx *= .7; o.fvy *= .7; o.bounces++; o.spin.x *= .5; o.spin.y *= .5; o.spin.z *= .5; }
    else { o.fly = false; o.wrecked = true; o.vx = 0; o.vz = 0; o.rot.x = 0; o.rot.z = (o.rot.z % 6.28 > 3.14 ? -1 : 1) * 1.45; }
  }
}
// cars are heavy: when two of them meet they shove each other, spin and skid to a stop
function velOf(o){
  if(o.skid || o.wrecked) return [o.vx, o.svy || 0];
  if(o.type === 'turn'){ const v = o.tv || 150; if(o.phase === 1) return [v*Math.cos(o.ang), v*Math.sin(o.ang)]; if(o.phase === 2) return [0, v]; }
  if(o.type === 'pull'){ if(o.phase === 0) return [0, -120]; if(o.phase === 1) return [150*Math.sin(o.ang), -150*Math.cos(o.ang)]; }
  return [o.vx, 0];
}
function startSkid(o, vx, vy, wz, vz){
  o.skid = true; o.wrecked = false; o.parked = false;
  if(o.a === undefined) o.a = 0;
  o.L = o.L || o.w; o.Wd = o.Wd || o.h;
  o.vx = vx; o.svy = vy; o.wz = wz; o.vz = vz; o.hz = o.hz || 0; o.lastHit = raceT;
}
function skidStep(o, dt){
  o.x += o.vx*dt; o.y += o.svy*dt; o.a += o.wz*dt; o.wz *= Math.exp(-1.8*dt);
  const sp = Math.hypot(o.vx, o.svy), ns = Math.max(0, sp - 520*dt);
  if(sp > 0){ o.vx *= ns/sp; o.svy *= ns/sp; }
  if(o.hz > 0 || o.vz > 0){ o.vz -= 1400*dt; o.hz += o.vz*dt; if(o.hz <= 0){ o.hz = 0; o.vz = 0; } }
  const c = Math.abs(Math.cos(o.a)), sn = Math.abs(Math.sin(o.a));
  o.w = c*o.L + sn*o.Wd; o.h = sn*o.L + c*o.Wd;
  if(ns < 15 && Math.abs(o.wz) < .3 && o.hz === 0){ o.skid = false; o.wrecked = true; o.vx = 0; o.svy = 0; o.wz = 0; }
}
function carCrash(a, b){
  if(raceT - (a.lastHit ?? -9) < .35 && raceT - (b.lastHit ?? -9) < .35) return;
  const [ax, ay] = velOf(a), [bx, by] = velOf(b);
  const rel = Math.hypot(ax - bx, ay - by);
  if(rel < 80) return;
  const e = .3, mx = (ax + bx)/2, my = (ay + by)/2, dx = (ax - bx)/2, dy = (ay - by)/2;
  const side = Math.sign(b.y - a.y) || 1, k = Math.min(1.6, rel/450);
  if(rel > 420){
    const victim = ax < bx ? a : b, hitter = victim === a ? b : a, vs = victim === a ? -side : side;
    launch(victim, Math.max(ax, bx)*1.2 + 250, vs*rand(300, 650) + (victim === a ? ay : by), rand(950, 1300));
    startSkid(hitter, Math.max(ax, bx)*.45, -vs*rand(80, 200), rand(3, 6)*(Math.random() < .5 ? -1 : 1), rand(150, 260));
  } else {
    startSkid(a, mx - e*dx, my - e*dy - side*rand(60, 180)*k, rand(2, 5)*k*(Math.random() < .5 ? -1 : 1), rand(60, 160)*k);
    startSkid(b, mx + e*dx, my + e*dy + side*rand(60, 180)*k, rand(2, 5)*k*(Math.random() < .5 ? -1 : 1), rand(60, 160)*k);
  }
  if(Math.abs(a.x - player.x) < 1600){
    SND.crash();
    text((a.x + b.x)/2, (a.y + b.y)/2, pick(['CRASH!','KERRUNCH!','FENDER BENDER!']), '#ff6b5e', 3.4);
    burst((a.x + b.x)/2, (a.y + b.y)/2, 1, '#cfe3ff', 16);
    if(Math.abs(a.x - player.x) < 500) shake = Math.max(shake, .3);
  }
}
function obsCrashes(){
  for(let i = 0; i < obs.length; i++){
    const a = obs[i]; if(a.dead || a.fly) continue;
    for(let j = i + 1; j < obs.length; j++){
      const b = obs[j]; if(b.dead || b.fly) continue;
      const la = LIGHT[a.type], lb = LIGHT[b.type];
      if(!la && !lb){
        if(!HEAVY[a.type] || !HEAVY[b.type]) continue;
        if(Math.abs(a.x - b.x) > (a.w + b.w)/2 || Math.abs(a.y - b.y) > (a.h + b.h)/2) continue;
        carCrash(a, b); continue;
      }
      if(!(la || HEAVY[a.type]) || !(lb || HEAVY[b.type])) continue;
      if(Math.abs(a.x - b.x) > (a.w + b.w)/2 || Math.abs(a.y - b.y) > (a.h + b.h)/2) continue;
      if(la && lb){
        // two light things: the faster one plows into the slower one and both go up
        if(Math.abs(a.vx - b.vx) < 60 && !a.wrecked && !b.wrecked) continue;
        const fast = a.vx >= b.vx ? a : b, slow = fast === a ? b : a, side = Math.sign(slow.y - fast.y) || 1;
        launch(slow, Math.max(fast.vx*1.2, 500), side*rand(250, 550), rand(850, 1150));
        launch(fast, fast.vx*.8, -side*rand(150, 350), rand(600, 850));
      } else {
        const lite = la ? a : b, car = la ? b : a, side = Math.sign(lite.y - car.y) || 1;
        let vx, vy = side*rand(150, 400);
        if(car.parked) vx = lite.vx*.55;                       // ran into a parked car: over the bonnet
        else vx = Math.max(car.vx*1.3, lite.vx) + rand(80, 220);
        if(car.type === 'turn' && car.phase >= 1) vy += 450;   // swept toward the side street
        if(car.type === 'pull' && car.phase >= 1){ vy -= 300; vx += 280; }
        launch(lite, vx*1.4 + 200, vy*1.6, rand(1000, 1350));
      }
    }
  }
}

function collide(r, o){
  if(o.type === 'dozer' && r.starT > 0){ r.kvy = (Math.sign(r.y - o.y) || 1) * 600; r.inv = .5; return; } // even Unstoppable can't move it
  if(r.starT > 0){
    const side = Math.sign(o.y - r.y) || 1;
    launch(o, Math.max(r.speed*2.4, o.vx*1.3) + 600, side*rand(350, 750), rand(1150, 1500));
    o.skid = false; o.parked = false; if(o.haz) o.haz.forEach(m => m.visible = false); o.haz = null;
    if(r.onVan === o) r.onVan = null;
    if(r.isPlayer){ text(o.x, o.y, pick(['SMASH!','OUTTA MY LANE!','BOWLED OVER!']), '#ffcc1a', 3.2); shake = Math.max(shake, .35); SND.bonk(); }
    return;
  }
  const h = HIT[o.type];
  r.hp -= h.dmg; r.hits++;
  r.speed *= h.keep; r.inv = .9;
  const dir = Math.sign(r.y - o.y) || 1;
  r.kvy = dir * (o.type==='pothole'||o.type==='cone' ? 120 : 300);
  if(o.type==='road') r.kvy = 520;
  burst(r.x + 18, r.y, .8, '#ffd27a', 10);
  if(r.isPlayer){
    text(r.x, r.y, pick(h.msg), '#ff6b5e', 2.6);
    SND.bonk();
    shake = Math.max(shake, o.type==='pothole'||o.type==='cone' ? .15 : .4);
  }
  if(o.type==='cone'){ o.dead = true; burst(o.x, o.y, .4, '#ff6a13', 8); }
  // light things you hit go flying; fast things that hit you send you flying
  if(LIGHT[o.type]) launch(o, Math.max(r.speed*1.8, o.vx) + 300, dir*-1*rand(250, 500), rand(850, 1150));
  if(o.type==='dozer'){ r.kvy = (Math.sign(r.y - o.y) || 1) * 700; r.vz = 620; r.tumble = true; r.tspin = 0; r.onVan = null; }
  else if((o.type==='road' || o.type==='turn' || o.type==='pull' || (o.type==='moped' && o.vx > r.speed)) && r.z < 5){
    r.vz = o.type === 'moped' ? 380 : 560; r.tumble = true; r.tspin = 0; r.onVan = null;
  }
  if(r.hp <= 0) wipeout(r);
}

function text(x, y, s, col, h=2.4){ fx.push({ x, y, h, s, col, t:1 }); }
function burst(x, y, h, col, n){ for(let i=0;i<n;i++) parts.push({ x, y, h, vx: rand(-160,160), vy: rand(-160,160), vh: rand(1,5), t: rand(.3,.6), col }); }

// ---------- AI ----------
function laneFree(y, x){
  for(const o of obs){
    if(o.dead) continue;
    if(Math.abs(o.x - x) < o.w/2 + 70 && Math.abs(o.y - y) < o.h/2 + 14) return false;
  }
  return true;
}

function updateAI(r, dt){
  if(r.wipe > 0 || r.finished && r.x > FINISH + 1200){ r.boosting = false; return; }
  const prog = clamp(r.x / FINISH, 0, 1);
  let target = r.cruise + 26*prog;
  const gap = r.x - player.x;
  if(gap < -380) target += 75; else if(gap < -150) target += 25; else if(gap > 520) target -= 45;
  r.target = target;



  let threat = null, tdx = 1e9;
  for(const o of obs){
    if(o.dead) continue;
    const dx = (o.x - o.w/2) - (r.x + 20);
    if(dx > -o.w && dx < 210 && Math.abs(o.y - r.y) < o.h/2 + 15 && (o.vx < r.speed - 20 || dx < 30)){
      if(dx < tdx){ tdx = dx; threat = o; }
    }
  }
  for(const o of obs){
    if(o.type === 'moped' && o.x < r.x && r.x - o.x < 450 && Math.abs(o.y - r.y) < 30 && Math.random() < r.ai.skill){ r.ai.ty = clamp(r.y + (o.y > r.y ? -45 : 45), 296, 396); break; }
  }
  if(r.y < ROAD_EDGE + 12){
    for(const o of obs){
      if(o.type==='road' && o.x < r.x && r.x - o.x < 420 && o.vx > r.speed && Math.abs(o.y - r.y) < 50){ r.ai.ty = rand(300,380); break; }
    }
  }
  if(threat){
    if(threat !== r.ai.last){ r.ai.last = threat; r.ai.willJump = Math.random() < r.ai.skill; }
    const up = threat.y - threat.h/2 - 18, dn = threat.y + threat.h/2 + 18;
    const opts = [up, dn].filter(y => y >= YMIN && y <= YMAX && laneFree(y, threat.x));
    if(opts.length){
      opts.sort((a,b) => (Math.abs(a-r.y) + (a < ROAD_EDGE ? 60 : 0)) - (Math.abs(b-r.y) + (b < ROAD_EDGE ? 60 : 0)));
      r.ai.ty = opts[0];
    }
    const blocked = Math.abs(threat.y - r.y) < threat.h/2 + 10;
    if(blocked && tdx < 95 && r.ai.willJump) jump(r);
  } else {
    r.ai.ty += (r.ai.lane - r.ai.ty) * Math.min(1, dt*.8);
    for(const pd of pickups){ if(pd.type !== 'pad') continue; const d = pd.x - r.x; if(d > 40 && d < 380 && Math.abs(pd.y - r.y) < 90){ r.ai.ty = pd.y; break; } } // rivals aim for boost pads
    if(Math.random() < dt*.18) r.ai.lane = rand(298,392);
  }
  r.steer = clamp((r.ai.ty - r.y)/28, -1, 1);

}

// ---------- update ----------
const keys = {};
function updateRacer(r, dt){
  r.pcd -= dt; r.pAnim -= dt; r.jcd -= dt; r.inv -= dt; r.boostT = (r.boostT || 0) - dt; r.starT = (r.starT || 0) - dt;
  if(r.tumble){ r.tspin += dt*13; if(r.z <= 0 && r.vz === 0 && r.tspin > .4) r.tumble = false; }
  if(r.wipe > 0){
    r.wipe -= dt; r.spin += dt*11;
    r.speed = Math.max(0, r.speed - 650*dt);
    if(r.wipe <= 0){ r.hp = 70; r.inv = 1.5; r.spin = 0; }
  } else {
    let target = r.isPlayer ? r.cruise : r.target;
    if(r.boostT > 0) target += 140; // short boost from a pickup
    if(r.braking) target = 110;
    if(r.finished && r.isPlayer) target = 200;
    const acc = r.speed < target ? 240 : (r.braking ? 650 : 170);
    r.speed += clamp(target - r.speed, -acc*dt, acc*dt);
    r.y += r.steer * 235 * dt;
  }
  r.lean += (r.steer - r.lean) * Math.min(1, dt*8);
  r.y += r.kvy * dt; r.kvy *= Math.pow(.015, dt);
  if(r.y < YMIN){ r.y = YMIN; r.kvy = 0; } if(r.y > YMAX){ r.y = YMAX; r.kvy = 0; }
  // delivery-truck roofs are something you can land on and ride across
  if(r.onVan){ const o = r.onVan; if(o.dead || o.fly || Math.abs(o.x - r.x) > o.w/2 + 6 || Math.abs(o.y - r.y) > o.h/2 + 6) r.onVan = null; }
  if(r.z > (r.onVan ? roofOf(r.onVan) : 0) || r.vz > 0){
    r.vz -= 1400*dt; r.z += r.vz*dt;
    if(r.vz <= 0 && !r.onVan && r.wipe <= 0 && r.z > 36){
      for(const o of obs) if((o.type === 'van' || o.type === 'car' || o.type === 'bus') && !o.dead && !o.fly && r.z <= roofOf(o) + 2 && r.z > roofOf(o) - 30 && Math.abs(o.x - r.x) < o.w/2 && Math.abs(o.y - r.y) < o.h/2 + 4){
        r.onVan = o;
        if(r.isPlayer && !o.roofed){ o.roofed = true; text(r.x + 30, r.y, (o.type === 'bus' ? pick(['ON THE BUS!','FREE RIDE!','TOP DECK!']) : pick(['ROOF RIDE!', o.type === 'van' ? 'ON THE TRUCK!' : 'CAR SURFING!','PARKOUR!'])), '#8ef0b0', 4.2); }
        break;
      }
    }
    const g = r.onVan ? roofOf(r.onVan) : 0;
    if(r.z <= g){ r.z = g; r.vz = 0; if(r.isPlayer) SND.land(); }
  }
  // on a bus roof you travel with the bus and can walk forward along it
  const ride = r.onVan && r.onVan.type === 'bus' && !r.onVan.fly ? r.onVan : null;
  if(ride){ r.x += (ride.vx + r.speed*.15) * dt; r.y = clamp(r.y + ride.vy*dt, YMIN, YMAX); }
  else r.x += r.speed * dt;
  if(!r.finished && r.x >= FINISH){
    // time the exact moment the line was crossed within this frame, so racers finishing together still get distinct times
    r.finished = true; r.ftime = raceT - (r.x - FINISH) / Math.max(1, r.speed); r.place = ++finishCount;
    if(r.isPlayer){
      SND.finish();
      if(!best || r.ftime < best){ best = r.ftime; r.newBest = true; lsSet('bb3d_best', String(best)); }
    }
  }
}

function update(dt){
  for(const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.h = Math.max(0, p.h + p.vh*dt); p.vh -= 12*dt; p.vx *= .92; p.vy *= .92; p.t -= dt; }
  parts = parts.filter(p => p.t > 0);
  for(const f of fx){ f.t -= dt*.9; f.h += 1.3*dt; }
  fx = fx.filter(f => f.t > 0);
  shake = Math.max(0, shake - 1.6*dt);

  if(AC) motorTick((mode === 'race' || mode === 'finish') && player.wipe <= 0, player.speed);
  if(mode === 'title'){ titleT += dt; return; }
  if(mode === 'paused') return;
  if(mode === 'countdown'){
    const before = Math.ceil(countT);
    countT -= dt;
    if(Math.ceil(countT) !== before && countT > 0) sfx(440, .12, 'square', 0, .05);
    if(countT <= 0){ mode = 'race'; sfx(880, .3, 'square', 0, .06); }
    camX = player.x - SCREEN_X;
    return;
  }

  raceT += dt; // keeps running after you finish so the other racers get their own times

  const ctrl = !player.finished && player.wipe <= 0;
  player.steer = !ctrl ? 0 : touchY !== null ? clamp((touchY - player.y)/10, -1, 1) : ((keys.right?1:0) - (keys.left?1:0));
  player.boosting = false;
  player.braking = false;

  for(const r of racers) if(!r.isPlayer) updateAI(r, dt);
  for(const r of racers) updateRacer(r, dt);

  for(let i=0;i<racers.length;i++) for(let j=i+1;j<racers.length;j++){
    const a = racers[i], b = racers[j];
    if(Math.abs(a.x-b.x) < 40 && Math.abs(a.y-b.y) < 20 && Math.abs(a.z-b.z) < 20){
      const d = (a.y < b.y ? -1 : 1) * 240 * dt;
      a.y = clamp(a.y + d, YMIN, YMAX); b.y = clamp(b.y - d, YMIN, YMAX);
    }
  }

  const lead = Math.max(...racers.map(r => r.x));
  while(nextSpawn < Math.max(player.x + 2800, lead + 600) && nextSpawn < FINISH - 350){
    spawnAt(nextSpawn);
    const prog = nextSpawn / FINISH;
    nextSpawn += rand(190, 380) * (1 - .38*prog);
  }
  roadT -= dt; if(roadT <= 0){ spawnRoadCar(); roadT = rand(.55, 1.4); }
  oncT -= dt; if(oncT <= 0){ spawnOncoming(); oncT = rand(.6, 1.6); }
  for(const sp of spots){ if(!sp.used && sp.x - TURN_R - player.x < 3000){ sp.used = true; if(Math.random() < .5) spawnPuller(sp); } }
  mopedT -= dt; if(mopedT <= 0 && player.x < FINISH - 600){ spawnMoped(); mopedT = rand(5, 9); }
  busT -= dt; if(busT <= 0 && mode === 'race' && !obs.some(o => o.type === 'bus' && o.phase < 3)){ busT = spawnBus() ? rand(13, 20) : 1; }

  const t = performance.now()/1000;
  for(const o of obs){
    if(o.fly){ flyStep(o, dt); continue; }
    if(o.skid){ skidStep(o, dt); continue; }
    if(o.wrecked) continue;
    o.x += o.vx * dt;
    if(o.type === 'moped'){
      // swerve around anything parked or slow ahead
      if(!o.blind) for(const c of obs){ if(c !== o && (c.type==='car'||c.type==='van'||c.type==='bus'||c.type==='mobility'||c.type==='pull'||c.wrecked) && !c.fly && c.x > o.x && c.x - o.x < 320 && Math.abs(c.y - o.by) < c.h/2 + 16){ o.by = clamp(o.by + (c.y > 345 ? -1 : 1)*320*dt, 296, 396); } }
      const ny = o.by + Math.sin(t*2.2 + o.ph)*4;
      if(!o.warned && o.x < player.x && player.x - o.x < 650){ o.warned = true; sfx(880, .09, 'square', 0, .05); setTimeout(() => sfx(880, .09, 'square', 0, .05), 140); }
      o.yaw = (ny - o.y) / Math.max(1, o.vx*dt) * .6; o.y = ny;
    } else if(o.type === 'mobility'){
      for(const c of obs){ if((c.type==='car'||c.type==='van'||c.type==='bus') && c.x > o.x && c.x - o.x < 140 && Math.abs(c.y - o.y) < c.h/2 + 18){ o.y = Math.max(300, o.y - 40*dt); } }
      o.y += Math.sin(t*1.3 + o.ph)*6*dt;
    } else if(o.type === 'turn'){
      const Xs = o.spot.x - TURN_R;
      if(o.phase === 0){ if(!o.tooted && o.x >= Xs - Math.max(o.vx, 120)*.7){ o.tooted = true; tootBeforeTurn(o); } if(o.x >= Xs){ o.phase = 1; o.x = Xs; o.vx = 0; o.ang = 0; } }
      else if(o.phase === 1){
        o.ang = Math.min(Math.PI/2, o.ang + (o.tv || 150)/TURN_R*dt);
        o.x = Xs + TURN_R*Math.sin(o.ang); o.y = (o.y0 ?? 210) + TURN_R*(1 - Math.cos(o.ang)); o.a = o.ang;
        if(o.tv){ // power-slide: the body swings out past the line it is driving, tyres smoking
          o.a = o.ang + .75*Math.sin(o.ang*2);
          if(Math.random() < .7) parts.push({ x: o.x - Math.cos(o.a)*45, y: o.y - Math.sin(o.a)*45, h: .3, vx: rand(-40, 40), vy: rand(-40, 40), vh: rand(.5, 1.5), t: rand(.5, .9), col: '#d9dbe0' });
          if(!o.screech && Math.abs(o.x - player.x) < 1500){ o.screech = true; sfx(1300, .55, 'sawtooth', -500, .03); noise(.55, .05, 3200, 6, 'bandpass', -900); }
        }
        if(o.ang >= Math.PI/2) o.phase = 2;
      } else { o.y += (o.tv || 150)*dt; if(o.y > (o.spot.kind === 'drive' ? 640 : 1300)) o.dead = true; }
      const c = Math.abs(Math.cos(o.a)), sn = Math.abs(Math.sin(o.a));
      o.w = c*o.L + sn*o.Wd; o.h = sn*o.L + c*o.Wd;
    } else if(o.type === 'pull'){
      const HOLD = 470, sx = o.spot.x;
      if(o.phase === -1){ o.wait -= dt; if(o.wait <= 0) o.phase = 0; }
      else if(o.phase === 0){ o.y = Math.max(HOLD, o.y - 120*dt); if(o.y <= HOLD){ o.hold -= dt; if(o.hold <= 0){ o.phase = 1; o.ang = 0; } } }
      else if(o.phase === 1){
        o.ang = Math.min(Math.PI/2, o.ang + 150/TURN_R*dt);
        o.x = sx + TURN_R*(1 - Math.cos(o.ang)); o.y = 210 + TURN_R*(1 - Math.sin(o.ang)); o.a = -Math.PI/2 + o.ang;
        if(o.ang >= Math.PI/2){ o.phase = 2; o.a = 0; o.vx = 160; }
      } else { o.vx = Math.min(560, o.vx + 260*dt); }
      const c = Math.abs(Math.cos(o.a)), sn = Math.abs(Math.sin(o.a));
      o.w = c*o.L + sn*o.Wd; o.h = sn*o.L + c*o.Wd;
    } else if(o.type === 'dozer'){
      // infinite mass: everything in the blade's path goes flying, the dozer never slows down
      for(const c of obs){
        if(c === o || c.fly || c.dead || c.type === 'pothole' || c.type === 'cone') continue;
        if(Math.abs(c.x - o.x) > (c.w + o.w)/2 || Math.abs(c.y - o.y) > (c.h + o.h)/2) continue;
        const side = Math.sign(c.y - o.y) || (Math.random() < .5 ? -1 : 1);
        c.skid = false; c.parked = false; if(c.haz){ c.haz.forEach(m => m.visible = false); c.haz = null; }
        launch(c, o.vx*rand(.9, 1.25), side*rand(250, 650), rand(900, 1400));
        if(Math.abs(c.x - player.x) < 1500){ SND.crash(); shake = Math.max(shake, .25); }
      }
      if(o.beacon) o.beacon.visible = Math.floor(t*5) % 2 === 0;
      if(o.x > player.x + 3500 || o.x > FINISH + 800) o.dead = true;
    } else if(o.type === 'bus'){
      const y0 = o.y, ease = u => u*u*(3 - 2*u);
      if(o.phase === 1){ // indicate, slow down and swing across into the stop
        const u = clamp(1 - (o.stopX - o.x) / BUS_IN, 0, 1);
        o.vx = Math.max(35, 260*Math.sqrt(1 - u));
        o.y = BUS_ROAD_Y + (BUS_LANE_Y - BUS_ROAD_Y)*ease(u);
        if(o.x >= o.stopX){ o.x = o.stopX; o.vx = 0; o.y = BUS_LANE_Y; o.phase = 2; o.blinkers.forEach(m => m.visible = false); }
      } else if(o.phase === 2){ // doors open; stays until you've had your chance, then leaves
        o.dwell += dt;
        const riding = racers.some(r => r.onVan === o);
        if(riding) o.rideT = (o.rideT || 0) + dt;
        if((o.dwell > 6 && player.x > o.stopX + 40 && !riding) || o.rideT > .8 || o.dwell > 16) o.phase = 3;
      } else { // pull back out into traffic
        o.vx = Math.min(520, o.vx + 140*dt);
        const u = clamp((o.x - o.stopX) / BUS_OUT, 0, 1);
        o.y = BUS_LANE_Y + (BUS_ROAD_Y - BUS_LANE_Y)*ease(u);
        if(o.x > player.x + 3600) o.dead = true;
      }
      o.vy = dt > 0 ? (o.y - y0) / dt : 0;
      o.a = o.vx > 5 ? Math.atan2(o.vy, o.vx) * .8 : 0;
      // riders steer around nothing here: the people waiting walk to the door and get on
      if(o.phase === 2 && o.st){
        for(const p of o.st.people){
          if(p.done) continue;
          const tx = o.stopX + o.w*.4 - o.st.x, ty = BUS_LANE_Y + o.h/2 + 4, dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
          if(d < 6){ p.done = true; p.mesh.visible = false; continue; }
          const v = 75*dt / d; p.x += dx*Math.min(1, v); p.y += dy*Math.min(1, v); p.walking = true;
        }
      }
    } else if(o.type === 'road'){
      if(o.vmax) o.vx = Math.min(o.vmax, o.vx + 300*dt);
      // a driver who decided to turn just takes the corner at speed, whoever is in the bike lane
      if(o.turnSpot && !o.tooted && o.x >= o.turnSpot.x - TURN_R - o.vx*.7){ o.tooted = true; tootBeforeTurn(o); }
      if(o.turnSpot && o.x >= o.turnSpot.x - TURN_R){
        o.type = 'turn'; o.spot = o.turnSpot; o.tv = Math.max(o.vx, 250); o.vx = 0; o.x = o.spot.x - TURN_R;
        o.y0 = o.y; o.phase = 1; o.ang = 0; o.a = 0; o.L = o.w; o.Wd = o.h; o.vmax = 0;
        continue;
      }
      for(const c of obs){ if(c !== o && (c.type==='road' || c.type==='turn' || c.type==='pull' || c.type==='bus') && !(o.blind && (c.type !== 'road' || c.wrecked || c.skid)) && Math.abs(c.y - o.y) < 40 && c.x > o.x && c.x - o.x < (c.w+o.w)/2 + 30) o.vx = Math.min(o.vx, c.vx); }
      if(!o.honked && o.behind && o.x > player.x - 200){ o.honked = true; if(Math.abs(o.y - player.y) < 60){ sfx(330, .3, 'sawtooth', 0, .03); sfx(415, .3, 'sawtooth', 0, .03); } }
    }
  }
  obsCrashes();
  checkPileup(dt);
  for(const c of oncoming) c.x += c.vx*dt;

  for(const r of racers){
    if(r.wipe > 0) continue;
    for(const o of obs){
      if(o.dead || o.fly || o === r.onVan) continue;
      if(Math.abs(o.x - r.x) >= o.w/2 + 20 || Math.abs(o.y - r.y) >= o.h/2 + 7) continue;
      if(r.z > HIT[o.type].zMax){
        if(r.isPlayer && !o.cleared && (o.type==='car'||o.type==='van'||o.type==='bus'||o.type==='dozer'||o.type==='road'||o.type==='turn'||o.type==='pull'||o.type==='moped'||o.type==='mobility')){
          o.cleared = true; text(r.x + 40, r.y, pick(['AIR!','HOP!','SICK JUMP!']), '#8ef0b0', 3 + r.z*ZS);
        }
        continue;
      }
      if(r.inv > 0) continue;
      collide(r, o);
      if(r.wipe > 0) break;
    }
  }
  for(const p of pickups){
    if(p.type === 'star'){
      if(!p.got && Math.abs(p.x - player.x) < 32 && Math.abs(p.y - player.y) < 26 && player.z < 50){
        p.got = true; player.starT = 5; player.hp = Math.max(player.hp, 60);
        text(p.x, p.y, 'UNSTOPPABLE!', '#ffcc1a', 3.4); SND.star();
      }
      continue;
    }
    for(const r of racers){
      if(r.wipe > 0 || r.z > 6 || Math.abs(p.x - r.x) > 60 || Math.abs(p.y - r.y) > 34) continue;
      if(r.isPlayer && !(r.boostT > 1.3)){ text(p.x, p.y, 'BOOST!', '#8ef0b0'); SND.boost(); }
      r.boostT = 1.6;
    }
  }

  const minX = Math.min(player.x - 700, ...racers.map(r => r.x - 700));
  obs = obs.filter(o => { const keep = !o.dead && (o.x > minX || (o.type === 'moped' && o.x > minX - 900) || (o.type === 'dozer' && o.x > minX - 1200)); if(!keep) drop(o); return keep; });
  pickups = pickups.filter(p => { const keep = !p.got && p.x > Math.min(player.x - 400, ...racers.map(r => r.x - 400)); if(!keep) drop(p); return keep; });
  oncoming = oncoming.filter(c => { const keep = c.x > player.x - 500; if(!keep) drop(c); return keep; });
  stops = stops.filter(st => { const keep = st.x > minX - 400; if(!keep) drop(st); return keep; });

  camX = player.x - SCREEN_X;
  if(player.finished){
    finishDelay += dt;
    if(finishDelay > 1.2 && mode === 'race') mode = 'finish';
  }
}

// ---------- sync 3D ----------
const camPos = new T.Vector3(), camLook = new T.Vector3(), tmpV = new T.Vector3();
const cam = { y: 330, ly: 330, h: 3.5, lh: 1.1, init: false };
function syncScene(dt){
  const now = performance.now();
  const blink = Math.floor(now/400) % 2 === 0, fastBlink = Math.floor(now/300) % 2 === 0;
  for(const o of obs){
    let yaw = 0;
    if(o.type === 'moped') yaw = -clamp(o.yaw || 0, -.5, .5);
    else if(o.a !== undefined) yaw = -o.a;
    place(o.mesh, o.x, o.y, (o.hz || 0)*ZS, yaw);
    if(o.rot){ o.mesh.rotation.y += o.rot.y; o.mesh.rotation.x = o.rot.x; o.mesh.rotation.z = o.rot.z; }
    if(o.haz) for(const h of o.haz) h.visible = blink;
    if(o.blinkers) for(const h of o.blinkers) h.visible = fastBlink;
    if(o.flag) o.flag.rotation.y = Math.sin(now/150 + o.ph) * .35;
  }
  for(const c of oncoming) place(c.mesh, c.x, c.y, 0, Math.PI);
  for(const st of stops){
    place(st.mesh, st.x, st.y, 0);
    for(const p of st.people){ p.mesh.position.set((p.y - st.y)*S, p.walking ? Math.abs(Math.sin(now/120))*.06 : 0, -p.x*S); }
  }
  padTex && (padTex.offset.y = -(now/400) % 1);
  for(const p of pickups){
    if(p.type === 'star'){ place(p.mesh, p.x, p.y, 1 + Math.sin(now/220 + p.t)*.15); p.spin.rotation.y = now/300; p.spin.rotation.x = Math.sin(now/400)*.4; continue; }
    place(p.mesh, p.x, p.y, 0);
    p.padMat.opacity = .6 + .4*Math.sin(now/110 + p.t); p.sign.position.y = 2.6 + Math.sin(now/300 + p.t)*.15;
  }
  for(const r of racers){
    const m = r.mesh;
    place(m, r.x, r.y, r.z*ZS + .02);
    if(r.aura){ r.aura.visible = r.starT > 0 && (r.starT > 1.2 || Math.floor(now/90) % 2 === 0); r.aura.scale.setScalar(1 + .08*Math.sin(now/70)); }
    m.visible = !(r.inv > 0 && r.wipe <= 0 && Math.floor(r.inv*12) % 2);
    if(r.tumble){ r.tilt.rotation.set(r.tspin, r.tspin*.4, r.tspin*.7); } else r.tilt.rotation.set(r.wipe > 0 ? -.3 : (r.z > 0 ? -.15 : 0), r.wipe > 0 ? r.spin : -r.lean*.15, r.wipe > 0 ? 1.1 : -r.lean*.28);
    for(const s of [-1, 1]){
      const a = r.arms[s];
      if(r.pAnim > 0 && s === r.pDir){ a.rotation.set(-.2, -s*1.45, 0); a.scale.set(1, 1, 1.35); }
      else { a.rotation.set(0, 0, 0); a.scale.set(1, 1, 1); }
    }
  }

  // camera: follows the bends of the street, smoothing only the sideways and height moves
  const k = cam.init ? 1 - Math.exp(-dt*7) : 1; cam.init = true;
  if(mode === 'title'){
    const x = titleT*180;
    toW(x, 250 + Math.sin(titleT*.3)*80, 5.5 + Math.sin(titleT*.2), camPos);
    toW(x + 420, 320, 1, camLook);
  } else {
    const plh = player.z*ZS;
    const ty = camMode === 0 ? player.y*.6 + 335*.4 : player.y*.4 + 335*.6;
    const tly = camMode === 0 ? player.y*.75 + 335*.25 : player.y*.5 + 335*.5;
    const th = camMode === 0 ? 3.5 + plh*.45 : 10;
    const tlh = camMode === 0 ? 1.1 + plh*.3 : 0;
    cam.y += (ty - cam.y)*k; cam.ly += (tly - cam.ly)*k; cam.h += (th - cam.h)*k; cam.lh += (tlh - cam.lh)*k;
    const back = camMode === 0 ? 6.8 : 9.5, ahead = camMode === 0 ? 14 : 10;
    toW(player.x - back*PX_PER_M, cam.y, cam.h, camPos);
    toW(player.x + ahead*PX_PER_M, cam.ly, cam.lh, camLook);
  }
  camera.position.copy(camPos);
  if(shake > 0) camera.position.add(tmpV.set(rand(-shake, shake), rand(-shake, shake)*.6, rand(-shake, shake)));
  camera.lookAt(camLook);
  const fovT = mode === 'race' && player.boostT > 0 ? 70 : 62;
  camera.fov += (fovT - camera.fov) * Math.min(1, dt*4); camera.updateProjectionMatrix();

  // sun follows the action so shadows stay crisp
  toW(mode === 'title' ? titleT*180 + 300 : player.x + 200, 300, 0, tmpV);
  sun.position.set(tmpV.x + 14, 30, tmpV.z + 8); sun.target.position.copy(tmpV); sun.target.updateMatrixWorld();
}

// projection helper for the 2D overlay
const pv = new T.Vector3();
function proj(x, y, h){
  toW(x, y, h, pv).project(camera);
  return { x: ((pv.x + 1)/2*glW - hudL) / hudW * W, y: (1 - pv.y)/2*H, ok: pv.z < 1 && pv.z > -1 && pv.x > -1.2 && pv.x < 1.2 };
}

}
function playerRank(){

function drawWorldLabels(){
  // rival name tags
  ctx.textAlign = 'center';
  for(const r of racers){
    if(r.isPlayer && !(mode === 'countdown' || (mode === 'race' && raceT < 3))) continue;
    const dist = Math.abs(r.x - player.x);
    if(!r.isPlayer && dist > 1600) continue;
    const p = proj(r.x, r.y, 2.35 + r.z*ZS);
    if(!p.ok) continue;
    const label = r.isPlayer ? 'YOU' : r.name;
    ctx.font = (r.isPlayer ? '12px ' + getFont('display') : '700 11px ' + getFont('body'));

    ctx.font = '22px ' + getFont('display');

    ctx.fillStyle = f.col; ctx.fillText(f.s, p.x, p.y);

  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

function render(dt){
  syncScene(dt);
  renderer.render(scene, camera);
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if(mode === 'title'){ drawTitle(); if(isTouch) drawMuteChip(); return; }
  drawWorldLabels();
  drawHUD();
  if(mode === 'countdown'){
    const n = Math.ceil(countT);
    centerText(n > 0 ? String(n) : 'GO!', 250, 110, n > 0 ? '#f3efe4' : '#5be38a');
    centerText(isTouch ? 'Drag to steer · Tap or swipe up to jump' : '← → steer · Space jump', 196, 16, '#f3efe4', 'body');
  } else if(mode === 'race' && raceT < 1.2){
    centerText('GO!', 250, 110, '#5be38a');
  } else if(mode === 'paused'){
    dim(.55); centerText('PAUSED', 260, 56, '#f3efe4'); centerText(isTouch ? 'Tap to resume' : 'Press P to resume', 300, 16, '#c9ccd4', 'body');
  } else if(mode === 'finish') drawFinish();
  if(isTouch) drawMuteChip();
}

// ---------- input ----------
let isTouch = false;
function startRace(){ initAudio(); reset(); mode = 'countdown'; }
function onPress(k){
  initAudio();
  if(k === 'mute'){ setMuted(!muted); return; }
  if(k === 'camera'){ camMode = (camMode + 1) % 2; return; }
  if(mode === 'title' || mode === 'finish'){ if(k === 'jump' || k === 'enter' || k === 'tap') startRace(); return; }
  if(k === 'pause'){ if(mode === 'paused') mode = prevMode; else if(mode === 'race' || mode === 'countdown'){ prevMode = mode; mode = 'paused'; } return; }
  if(mode === 'paused'){ if(k === 'tap') mode = prevMode; return; }
  if(k === 'restart'){ startRace(); return; }
  if(mode !== 'race' || player.finished) return;
  if(k === 'jump') jump(player);
}
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', 
  Space:'jump', KeyC:'camera', KeyP:'pause', Escape:'pause', KeyM:'mute', KeyR:'restart', Enter:'enter' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if(!k) return;
  e.preventDefault();
  if(!keys[k]) onPress(k);
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if(k) keys[k] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; if(mode === 'race'){ prevMode = 'race'; mode = 'paused'; } });

function enableTouch(){ if(isTouch) return; isTouch = true; document.body.classList.add('touch'); fit(); }
if(matchMedia('(pointer: coarse)').matches) enableTouch();
addEventListener('touchstart', enableTouch, { passive:true });
// Touch gestures, anywhere on screen: drag left/right and the bike follows your finger,
// tap or swipe up to jump, tap the II chip to pause. A second finger can tap to jump while the first steers.
function drawMuteChip(){
  const b = muteBox(), cx = b.x + 18, cy = b.y + 26;
  ctx.fillStyle = 'rgba(10,12,16,.72)'; rr(b.x, b.y, b.w, b.h, 8);
  ctx.fillStyle = '#f3efe4'; ctx.beginPath(); ctx.moveTo(cx - 8, cy - 5); ctx.lineTo(cx - 2, cy - 5); ctx.lineTo(cx + 6, cy - 12); ctx.lineTo(cx + 6, cy + 12); ctx.lineTo(cx - 2, cy + 5); ctx.lineTo(cx - 8, cy + 5); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = muted ? '#ff4d3d' : '#f3efe4'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
  if(muted){ ctx.moveTo(cx + 12, cy - 7); ctx.lineTo(cx + 24, cy + 7); ctx.moveTo(cx + 24, cy - 7); ctx.lineTo(cx + 12, cy + 7); }
  else { ctx.arc(cx + 8, cy, 8, -.8, .8); ctx.moveTo(cx + 8 + 14*Math.cos(-.8), cy + 14*Math.sin(-.8)); ctx.arc(cx + 8, cy, 14, -.8, .8); }
  ctx.stroke(); ctx.lineCap = 'butt';
}
function pauseBox(){ return { x: W - 222, y: 8, w: 52, h: 52 }; }
function muteBox(){ return { x: W - 284, y: 8, w: 52, h: 52 }; }
function hit(q, b){ return q.x >= b.x - 6 && q.x <= b.x + b.w + 6 && q.y >= b.y - 6 && q.y <= b.y + b.h + 6; }
function toHud(e){ const r = hud.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
const touches = new Map();
let steerId = null, touchY = null;
const DEAD = 10, SWIPE = 36;
// screen pixels per unit of sideways movement at the player's spot on the road, so the bike tracks the finger 1:1
function pxPerUnit(){
  const a = proj(player.x, player.y - 20, 0), b = proj(player.x, player.y + 20, 0);
  return Math.max(.5, Math.abs(b.x - a.x) / 40 * hudW / W);
}
stage.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  const q = toHud(e);
  if(isTouch && hit(q, muteBox())){ onPress('mute'); return; }
  if(mode !== 'race' && mode !== 'countdown'){ onPress('tap'); return; }
  if(isTouch && hit(q, pauseBox())){ onPress('pause'); return; }
  touches.set(e.pointerId, { x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: false, jumped: false });
});
stage.addEventListener('pointermove', e => {
  const t = touches.get(e.pointerId); if(!t) return;
  const dx = e.clientX - t.x0, dy = e.clientY - t.y0;
  if(Math.hypot(dx, dy) > DEAD) t.moved = true;
  if(!t.jumped && dy < -SWIPE && -dy > Math.abs(dx) && performance.now() - t.t0 < 500){ t.jumped = true; onPress('jump'); }
  if(steerId === null && Math.abs(dx) > DEAD && Math.abs(dx) > Math.abs(dy) * .7){
    steerId = e.pointerId; t.baseX = t.x0; t.baseY = player.y; t.ppu = pxPerUnit();
  }
  if(steerId !== e.pointerId) return;
  // the bike follows the finger: drag 1cm across the screen and it moves 1cm across the road
  let y = t.baseY + (e.clientX - t.baseX) / t.ppu;
  // past the edge of the street, re-anchor so dragging back responds straight away
  if(y > YMAX){ t.baseX += (y - YMAX) * t.ppu; y = YMAX; }
  if(y < YMIN){ t.baseX -= (YMIN - y) * t.ppu; y = YMIN; }
  touchY = y;
});
const endTouch = e => {
  const t = touches.get(e.pointerId); if(!t) return;
  touches.delete(e.pointerId);
  if(steerId === e.pointerId){ steerId = null; touchY = null; }
  if(e.type === 'pointerup' && !t.moved && !t.jumped && performance.now() - t.t0 < 300) onPress('jump');
};
stage.addEventListener('pointerup', endTouch);
stage.addEventListener('pointercancel', endTouch);
stage.addEventListener('contextmenu', e => e.preventDefault());

// ---------- sizing ----------
function fit(){
  let w, h;
  if(isTouch){
    // phones: fill the screen edge to edge in landscape; in portrait, fit a 16:9 strip across the width
    const vw = window.innerWidth, vh = window.innerHeight;
    w = vw; h = vw / vh >= 16/9 ? vh : Math.round(vw * 9/16);
  } else {
    const availW = document.body.clientWidth - 32;
    const availH = window.innerHeight - document.getElementById('legend').offsetHeight - 44;
    w = Math.max(240, Math.min(availW, availH * 16/9, 1280)); h = w * 9/16;
  }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  // HUD sits inside the notch/safe area; it keeps 540 units of height and widens past 960 on wide screens
  const sr = stage.getBoundingClientRect(), hr = hud.getBoundingClientRect();
  glW = w; hudL = hr.left - sr.left; hudW = hr.width || w;
  W = Math.max(960, H * hudW / h);
  hud.width = Math.round(hudW * dpr); hud.height = Math.round(h * dpr);
  K = hud.height / H;
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));
document.addEventListener('visibilitychange', () => { if(document.hidden && mode === 'race'){ prevMode = 'race'; mode = 'paused'; } });
if(document.fonts && document.fonts.load){
  Promise.all([document.fonts.load('40px Bungee'), document.fonts.load('700 16px "Chakra Petch"')]).then(() => {
    fontsReady = document.fonts.check('40px Bungee');
    if(finishBanner){ // redraw the banner now that the display face is in
      const c = finishBanner.tex.image.getContext('2d');
      c.fillStyle = '#ffcc1a'; c.fillRect(0, 12, 1024, 72);
      c.fillStyle = '#15171d'; c.font = '56px Bungee, Impact, sans-serif'; c.textAlign = 'center'; c.fillText('FINISH  ·  BIKELANE BRAWLERS', 512, 68);
      finishBanner.tex.needsUpdate = true;
    }
  }).catch(()=>{});
}

// ---------- loop ----------
reset();
fit();
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  update(dt);
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__bb = { spawnBus, get stops(){ return stops; }, addObs, get pickups(){ return pickups; }, spawnMoped, spawnPuller, get spots(){ return spots; }, get mode(){ return mode; }, get player(){ return player; }, get racers(){ return racers; }, get obs(){ return obs; }, startRace, keys, onPress, setCam(m){ camMode = m; } };
})();

<script>
// Offline + over-the-air updates. A new deploy installs in the background; the toast swaps it in.
if('serviceWorker' in navigator){
  const btn = document.getElementById('upd');
  let reloading = false;
  const offer = w => { btn.hidden = false; btn.onclick = () => { btn.textContent = 'Updating…'; w.postMessage('skipWaiting'); }; };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloading) return; reloading = true; location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => { if(w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    // Home-screen apps on iOS resume instead of relaunching, so check for a new version whenever it comes back to the front.
    document.addEventListener('visibilitychange', () => { if(!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
}
</script>
